<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Detail with RayCarWash — Earnings, schedule, tools · Fort Wayne, IN</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

  <script>
    // Bootstrap: relative subresources need the ?t= token from the parent URL
    (function () {
      var params = new URLSearchParams(location.search);
      var t = params.get('t');
      var tk = t ? ('?t=' + t) : '';
      var cssFiles = ["src/styles.css","src/detailers.css"];
      cssFiles.forEach(function (c) {
        var l = document.createElement('link');
        l.rel = 'stylesheet';
        l.href = c + tk;
        document.head.appendChild(l);
      });
      window.__tk = tk;
    })();
  </script>
</head>
<body>
  <div id="root"></div>

  <script>
    (function () {
      var tk = window.__tk || '';
      function addScript(src, type) {
        return new Promise(function (res, rej) {
          var s = document.createElement('script');
          if (type) s.type = type;
          s.src = src.indexOf('http') === 0 ? src : (src + tk);
          s.onload = res;
          s.onerror = function () { rej(new Error('Failed: ' + src)); };
          document.body.appendChild(s);
        });
      }
      async function boot() {
        await addScript('https://unpkg.com/react@18.3.1/umd/react.development.js');
        await addScript('https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js');
        await addScript('https://unpkg.com/@babel/standalone@7.29.0/babel.min.js');
        var babelFiles = ["src/tweaks-panel.jsx","src/icons.jsx","src/sections-b.jsx","src/detailers-a.jsx","src/detailers-b.jsx","src/detailers-app.jsx"];
        for (var i = 0; i < babelFiles.length; i++) {
          var f = babelFiles[i];
          var resp = await fetch(f + tk);
          var code = await resp.text();
          var s = document.createElement('script');
          s.type = 'text/babel';
          s.dataset.presets = 'react';
          s.textContent = code;
          document.body.appendChild(s);
        }
        if (window.Babel && window.Babel.transformScriptTags) {
          window.Babel.transformScriptTags();
        }
      }
      boot().catch(function (e) { console.error('Boot failed:', e); });
    })();
  </script>
</body>
</html>
